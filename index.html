<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Cloud Stat</title>
    <style>
        :root { --primary: #007AFF; --bg: #f5f7fa; --card: #ffffff; }
        body { background-color: var(--bg); font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { background: var(--card); border-radius: 24px; padding: 30px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        h1 { color: var(--primary); font-size: 24px; margin-bottom: 20px; }
        select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #d2d2d7; font-size: 16px; margin-bottom: 20px; }
        .stat-box { background: #fbfbfd; border: 1px solid #f2f2f7; border-radius: 16px; padding: 15px; margin-bottom: 12px; }
        .label { font-size: 11px; color: #86868b; text-transform: uppercase; display: block; margin-bottom: 5px; }
        .value { font-size: 28px; font-weight: bold; color: #000; }
        .footer { margin-top: 20px; font-size: 10px; color: #aeaeb2; }
    </style>
</head>
<body>

<div class="container">
    <h1>IT Cloud Stat</h1>
    
    <select id="city" onchange="updateStats()">
        <option value="160">Қазақстан (Барлығы)</option>
        <option value="40">Алматы</option>
        <option value="159">Астана</option>
        <option value="165">Қостанай</option>
    </select>

    <div class="stat-box">
        <span class="label">Бос орындар саны</span>
        <span id="v-count" class="value">...</span>
    </div>

    <div class="stat-box">
        <span class="label">Орташа жалақы</span>
        <span id="v-salary" class="value">...</span>
    </div>

    <div class="footer">Cloud Infrastructure: Vercel | Data: HH API</div>
</div>

<script>
    async function updateStats() {
        const cityId = document.getElementById('city').value;
        const vEl = document.getElementById('v-count');
        const sEl = document.getElementById('v-salary');

        vEl.innerText = "...";
        sEl.innerText = "...";

        try {
            // Сұранысқа User-Agent қосылды
            const response = await fetch(`https://api.hh.ru/vacancies?text=программист&area=${cityId}&only_with_salary=true`, {
                headers: {
                    'User-Agent': 'CloudStatProject/1.0'
                }
            });

            const data = await response.json();
            vEl.innerText = (data.found || 0).toLocaleString();

            if (data.items && data.items.length > 0) {
                let sum = 0, count = 0;
                data.items.forEach(item => {
                    if (item.salary && item.salary.from && item.salary.currency === 'KZT') {
                        sum += item.salary.from;
                        count++;
                    }
                });
                sEl.innerText = count > 0 ? Math.round(sum / count).toLocaleString() + " ₸" : "Келісімді";
            } else {
                sEl.innerText = "Мәлімет жоқ";
            }
        } catch (e) {
            vEl.innerText = "Қате";
            sEl.innerText = "Байланыс жоқ";
        }
    }
    window.onload = updateStats;
</script>

</body>
</html>
