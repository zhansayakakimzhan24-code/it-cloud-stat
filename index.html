<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud IT Monitoring</title>
    <style>
        body { background-color: #f5f7fa; color: #1d1d1f; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { background: white; border-radius: 28px; padding: 40px; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.05); }
        h1 { color: #007AFF; margin-bottom: 10px; }
        .subtitle { color: #86868b; font-size: 14px; margin-bottom: 30px; }
        select { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #d2d2d7; font-size: 16px; margin-bottom: 25px; }
        .stat-box { background: #fbfbfd; border: 1px solid #f2f2f7; border-radius: 18px; padding: 20px; margin-bottom: 15px; }
        .label { font-size: 11px; font-weight: bold; color: #86868b; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .value { font-size: 28px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>IT Cloud Stat</h1>
        <p class="subtitle">IT және Робототехника: Бұлттық мониторинг</p>
        <select id="city" onchange="updateStats()">
            <option value="160">Қазақстан (Жалпы)</option>
            <option value="40">Алматы</option>
            <option value="159">Астана</option>
            <option value="165">Қостанай</option>
        </select>
        <div class="stat-box">
            <span class="label">IT мамандарына бос орындар</span>
            <span id="v-count" class="value">0</span>
        </div>
        <div class="stat-box">
            <span class="label">Орташа жалақы (бастапқы)</span>
            <span id="v-salary" class="value">---</span>
        </div>
    </div>

    <script>
        async function updateStats() {
            const cityId = document.getElementById('city').value;
            const vEl = document.getElementById('v-count');
            const sEl = document.getElementById('v-salary');

            try {
                // 'IT' сөзі бойынша іздеу
                const res = await fetch(`https://api.hh.ru/vacancies?text=IT&area=${cityId}&only_with_salary=true`);
                const data = await res.json();

                // 'found' бар екенін және ол 'undefined' емес екенін тексеру
                vEl.innerText = (data.found || 0).toLocaleString();

                if (data.items && data.items.length > 0) {
                    let total = 0, count = 0;
                    data.items.forEach(item => {
                        if (item.salary && item.salary.from && item.salary.currency === 'KZT') {
                            total += item.salary.from;
                            count++;
                        }
                    });
                    sEl.innerText = count > 0 ? Math.round(total / count).toLocaleString() + " ₸" : "Келісімді";
                } else {
                    sEl.innerText = "Мәлімет жоқ";
                }
            } catch (e) {
                vEl.innerText = "Қате";
                sEl.innerText = "Байланыс жоқ";
            }
        }
        window.onload = updateStats;
    </script>
</body>
</html>
