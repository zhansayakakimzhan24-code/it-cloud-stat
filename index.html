<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Cloud Stat - Live Monitoring</title>
    <style>
        :root {
            --primary: #007AFF;
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #1d1d1f;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card);
            border-radius: 28px;
            padding: 35px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        .badge {
            background: #eef2ff;
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        h1 { font-size: 26px; margin: 20px 0 8px 0; color: var(--text); }
        .desc { font-size: 14px; color: #86868b; margin-bottom: 30px; line-height: 1.4; }

        select {
            width: 100%; padding: 14px; border-radius: 14px; border: 1px solid #d2d2d7;
            font-size: 16px; margin-bottom: 25px; outline: none; background: #fbfbfd;
            cursor: pointer; -webkit-appearance: none;
        }

        .stat-box {
            background: #fbfbfd; border: 1px solid #f2f2f7; border-radius: 20px;
            padding: 20px; margin-bottom: 15px; transition: transform 0.2s;
        }

        .label { font-size: 11px; color: #86868b; text-transform: uppercase; margin-bottom: 8px; display: block; font-weight: 600; }
        .value { font-size: 32px; font-weight: 800; color: #000; }

        .footer { margin-top: 25px; font-size: 11px; color: #aeaeb2; border-top: 1px solid #f2f2f7; padding-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <span class="badge">CLOUD MONITORING</span>
    <h1>IT Cloud Stat</h1>
    <p class="desc">IT және Робототехника: Қазақстан нарығының мониторингі</p>

    <select id="city" onchange="updateStats()">
        <option value="160">Қазақстан (Барлығы)</option>
        <option value="40">Алматы</option>
        <option value="159">Астана</option>
        <option value="162">Шымкент</option>
        <option value="165">Қостанай</option>
    </select>

    <div class="stat-box">
        <span class="label">Табылған вакансиялар</span>
        <span id="v-count" class="value">...</span>
    </div>

    <div class="stat-box">
        <span class="label">Орташа жалақы (KZT)</span>
        <span id="v-salary" class="value">...</span>
    </div>

    <div class="footer">
        Infrastructure: Vercel Cloud | Source: HH API
    </div>
</div>

<script>
    async function updateStats() {
        const cityId = document.getElementById('city').value;
        const vEl = document.getElementById('v-count');
        const sEl = document.getElementById('v-salary');

        vEl.innerText = "...";
        sEl.innerText = "...";

        try {
            // HH API талабы: Тексеру үшін міндетті түрде User-Agent қажет
            const response = await fetch(`https://api.hh.ru/vacancies?text=программист&area=${cityId}&only_with_salary=true&per_page=20`, {
                headers: {
                    'User-Agent': 'VercelCloudMonitoring/1.0 (contact: your-email@example.com)'
                }
            });

            if (!response.ok) throw new Error('API Error');
            
            const data = await response.json();

            // Вакансия санын шығару
            vEl.innerText = (data.found || 0).toLocaleString();

            // Орташа жалақыны есептеу
            if (data.items && data.items.length > 0) {
                let sum = 0;
                let count = 0;

                data.items.forEach(item => {
                    if (item.salary && item.salary.from && item.salary.currency === 'KZT') {
                        sum += item.salary.from;
                        count++;
                    }
                });

                if (count > 0) {
                    const avg = Math.round(sum / count);
                    sEl.innerText = avg.toLocaleString() + " ₸";
                } else {
                    sEl.innerText = "Келісімді";
                }
            } else {
                sEl.innerText = "Дерек жоқ";
            }

        } catch (error) {
            console.error('Fetch Error:', error);
            vEl.innerText = "Қате";
            sEl.innerText = "Байланыс жоқ";
        }
    }

    // Бет ашылғанда бірден деректерді тарту
    window.onload = updateStats;
</script>

</body>
</html>
