<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Cloud Monitoring</title>
    <style>
        :root {
            --primary: #007AFF;
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #1d1d1f;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card);
            border-radius: 24px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .badge {
            background: #eef2ff;
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        h1 { font-size: 24px; margin: 15px 0 5px 0; color: var(--primary); }
        .desc { font-size: 13px; color: #86868b; margin-bottom: 25px; }

        select {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #d2d2d7;
            font-size: 16px; margin-bottom: 20px; outline: none; background: #fbfbfd;
        }

        .stat-box {
            background: #fbfbfd; border: 1px solid #f2f2f7; border-radius: 16px;
            padding: 15px; margin-bottom: 12px;
        }

        .label { font-size: 10px; color: #86868b; text-transform: uppercase; margin-bottom: 5px; display: block; }
        .value { font-size: 26px; font-weight: bold; color: #000; }

        .footer { margin-top: 20px; font-size: 10px; color: #aeaeb2; border-top: 1px solid #f2f2f7; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <span class="badge">Live Cloud Monitoring</span>
    <h1>IT Cloud Stat</h1>
    <p class="desc">Қазақстандағы IT нарығының мониторингі</p>

    <select id="city" onchange="updateStats()">
        <option value="160">Қазақстан (Барлығы)</option>
        <option value="40">Алматы</option>
        <option value="159">Астана</option>
        <option value="162">Шымкент</option>
        <option value="165">Қостанай</option>
    </select>

    <div class="stat-box">
        <span class="label">Табылған бос орындар</span>
        <span id="v-count" class="value">...</span>
    </div>

    <div class="stat-box">
        <span class="label">Орташа жалақы (бастапқы)</span>
        <span id="v-salary" class="value">...</span>
    </div>

    <div class="footer">
        Data source: HeadHunter API | Infrastructure: Vercel Cloud
    </div>
</div>

<script>
    async function updateStats() {
        const cityId = document.getElementById('city').value;
        const vEl = document.getElementById('v-count');
        const sEl = document.getElementById('v-salary');

        // Жүктелу кезіндегі визуализация
        vEl.innerText = "...";
        sEl.innerText = "...";

        try {
            // HH API-ға сұраныс: "программист" сөзі бойынша, тек жалақысы бар вакансиялар
            const response = await fetch(`https://api.hh.ru/vacancies?text=программист&area=${cityId}&only_with_salary=true&per_page=20`, {
                headers: {
                    'User-Agent': 'VercelCloudMonitoring/1.0'
                }
            });

            if (!response.ok) throw new Error('API қатесі');
            const data = await response.json();

            // Вакансия санын шығару
            vEl.innerText = (data.found || 0).toLocaleString();

            // Жалақыны есептеу (алғашқы 20 вакансияның орташа мәні)
            if (data.items && data.items.length > 0) {
                let sum = 0;
                let count = 0;

                data.items.forEach(item => {
                    if (item.salary && item.salary.from && item.salary.currency === 'KZT') {
                        sum += item.salary.from;
                        count++;
                    }
                });

                if (count > 0) {
                    const avg = Math.round(sum / count);
                    sEl.innerText = avg.toLocaleString() + " ₸";
                } else {
                    sEl.innerText = "Келісімді";
                }
            } else {
                sEl.innerText = "Дерек жоқ";
            }

        } catch (error) {
            console.error(error);
            vEl.innerText = "Қате";
            sEl.innerText = "Байланыс жоқ";
        }
    }

    // Бет ашылғанда бірден деректерді тарту
    window.onload = updateStats;
</script>

</body>
</html>
